<style>
/* ===== 基础重置 ===== */
*{box-sizing:border-box;margin:0;padding:0}

/* ===== 全局 ===== */
body{
  font-family:"STKaiti","KaiTi","楷体","SimSun","宋体",serif;
  background:#fdf6ec;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ===== 全局目录页 ===== */
.toc{
  width:100%;max-width:900px;min-height:100vh;
  padding:30px 20px;display:none;
  background:linear-gradient(180deg,#fef9f0,#f5ecd7);
}
.toc h2{text-align:center;font-size:32px;color:#8b4513;margin-bottom:30px;letter-spacing:4px}
.toc .toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;max-width:800px;margin:0 auto}
.toc .toc-card{
  display:flex;align-items:center;padding:14px 18px;
  background:#fff;border-radius:12px;cursor:pointer;
  transition:.2s;box-shadow:0 2px 8px rgba(139,69,19,0.08);
  border-left:4px solid #d4a574;
}
.toc .toc-card:hover{transform:translateX(6px);box-shadow:0 4px 16px rgba(139,69,19,0.15)}
.toc .toc-card .toc-num{
  width:36px;height:36px;background:#8b4513;color:#fff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;margin-right:14px;flex-shrink:0
}
.toc .toc-card .toc-info{flex:1}
.toc .toc-card .toc-title{font-size:16px;color:#3b2f2f;font-weight:bold}
.toc .toc-card .toc-sub{font-size:12px;color:#a0522d;margin-top:2px}
.toc .toc-card .toc-count{font-size:11px;color:#a09080;margin-top:3px}

/* 目录页右上角：查看人物关系图谱按钮 */
.toc .toc-map-btn{
  position:absolute;top:24px;right:24px;z-index:10;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#8b4513,#a0522d);
  color:#fff;border:none;padding:10px 18px;
  border-radius:30px;font-size:14px;letter-spacing:2px;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 12px rgba(139,69,19,0.3);
  transition:.25s
}
.toc .toc-map-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 6px 18px rgba(139,69,19,0.45)}
.toc .toc-map-btn:active{transform:translateY(0) scale(.98)}
.toc{position:relative}

/* ===== 篇章目录页 ===== */
.ch-toc{
  width:100%;max-width:900px;min-height:100vh;
  padding:30px 20px;display:none;
  background:linear-gradient(180deg,#fef9f0,#f5ecd7);
}
.ch-toc.active{display:block}

/* ===== 原文注音卡 ===== */
.yuanwen-area{
  margin:16px auto 0;max-width:640px;width:100%;
  background:#fdf6e3;border:2px solid #e0c9a6;border-radius:12px;
  padding:14px 18px;box-shadow:0 2px 8px rgba(139,69,19,0.08);
}
.yuanwen-area .yw-label{
  font-size:13px;color:#a0522d;letter-spacing:2px;margin-bottom:8px;font-weight:bold;
}
.yuanwen-area .yw-text{
  font-size:22px;line-height:2.2;color:#3b2f2f;
  font-family:"STKaiti","KaiTi","楷体","SimSun","宋体",serif;
}
.yuanwen-area .yw-text rt{font-size:11px;color:#8b6914}
.ch-toc .ch-toc-header{text-align:center;margin-bottom:24px}
.ch-toc .ch-toc-header .ch-num{font-size:14px;color:#a0522d;letter-spacing:2px}
.ch-toc .ch-toc-header .ch-name{font-size:36px;color:#8b4513;margin:6px 0;letter-spacing:4px}
.ch-toc .ch-toc-header .ch-py{font-size:16px;color:#b8860b;margin-bottom:6px}
.ch-toc .ch-toc-header .ch-summary{font-size:15px;color:#5c4033}
.ch-toc .ch-toc-list{list-style:none;max-width:650px;margin:0 auto}
.ch-toc .ch-toc-item{
  display:flex;align-items:center;padding:12px 16px;margin:6px 0;
  background:#fff;border-radius:10px;cursor:pointer;
  transition:.2s;box-shadow:0 1px 6px rgba(139,69,19,0.06);
  border-left:3px solid #e0c9a6;
}
.ch-toc .ch-toc-item:hover{transform:translateX(4px);box-shadow:0 3px 12px rgba(139,69,19,0.12)}
.ch-toc .ch-toc-item .s-num{width:30px;height:30px;background:#f5ecd7;color:#8b4513;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;margin-right:12px;flex-shrink:0}
.ch-toc .ch-toc-item .s-info{flex:1}
.ch-toc .ch-toc-item .s-title{font-size:15px;color:#3b2f2f}
.ch-toc .ch-toc-item .s-speaker{font-size:11px;color:#a09080;margin-top:1px}
.ch-toc .btn-back{display:block;margin:20px auto;padding:10px 30px;background:#f5ecd7;border:2px solid #d4a574;color:#a0522d;font-size:15px;border-radius:30px;cursor:pointer;font-family:inherit;letter-spacing:2px;transition:.2s}
.ch-toc .btn-back:hover{background:#d4a574;color:#fff}

/* ===== 漫画页面 ===== */
.comic-page{
  width:100%;max-width:900px;min-height:100vh;
  display:none;flex-direction:column;
  background:#fef9f0;
  position:relative;
  padding:20px;
}
.comic-page.active{display:flex}

/* 顶部导航 */
.comic-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;margin-bottom:10px;
  border-bottom:2px solid #e8d5b7;
}
.comic-header .chap-num{font-size:14px;color:#a0522d}
.comic-header .chap-title{font-size:20px;color:#8b4513;letter-spacing:2px}
.comic-header .page-indicator{font-size:14px;color:#a09080}

/* 主体漫画区 */
.comic-body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;padding:20px 0;
}

/* 人物画像区 */
.character-area{
  display:flex;align-items:flex-end;gap:20px;
  max-width:700px;width:100%;
}
.character-img{
  width:180px;height:auto;border-radius:16px;
  box-shadow:0 6px 20px rgba(139,69,19,0.15);
  background:#f5ecd7;object-fit:contain;
  flex-shrink:0;
}
.character-img.dual{width:130px}
.character-img.small{width:100px}

/* 对话气泡 */
.speech-area{flex:1;display:flex;flex-direction:column;gap:12px}
.speech-bubble{
  background:#fff;border-radius:20px;
  padding:18px 22px;position:relative;
  box-shadow:0 4px 16px rgba(139,69,19,0.1);
  border:2px solid #e8d5b7;
}
.speech-bubble.left::before{
  content:"";position:absolute;left:-14px;top:30px;
  width:0;height:0;
  border-top:14px solid transparent;
  border-bottom:14px solid transparent;
  border-right:14px solid #fff;
}
.speech-bubble.left::after{
  content:"";position:absolute;left:-18px;top:28px;
  width:0;height:0;
  border-top:16px solid transparent;
  border-bottom:16px solid transparent;
  border-right:16px solid #e8d5b7;
}
.speech-bubble .speaker-name{
  font-size:14px;color:#a0522d;margin-bottom:8px;
  font-weight:bold;letter-spacing:1px;
}
.speech-bubble .text{
  font-size:22px;line-height:1.8;color:#3b2f2f;
  letter-spacing:2px;
}

/* Ruby 拼音样式 */
ruby{font-size:22px}
rt{
  font-size:11px;color:#8b7355;letter-spacing:0;
  font-family:"KaiTi","楷体",serif;
}

/* 白话翻译区 */
.translation-area{
  max-width:700px;width:100%;
  background:#fdf3e3;border-radius:16px;
  padding:16px 20px;border:2px dashed #d4c5a9;
}
.translation-area .tl-label{
  font-size:13px;color:#b8860b;margin-bottom:6px;
  letter-spacing:2px;
}
.translation-area .tl-text{
  font-size:17px;line-height:1.8;color:#5c4033;
}

/* 底部导航 */
.comic-footer{
  display:flex;align-items:center;justify-content:center;
  gap:16px;padding:16px 0;flex-wrap:wrap;
  border-top:2px solid #e8d5b7;margin-top:10px;
}
.comic-footer button{
  background:#fff;border:2px solid #8b4513;color:#8b4513;
  padding:10px 28px;font-size:16px;border-radius:30px;
  cursor:pointer;font-family:inherit;letter-spacing:2px;
  transition:.2s;
}
.comic-footer button:hover{background:#8b4513;color:#fff}
.comic-footer button:disabled{opacity:0.3;cursor:not-allowed}
.comic-footer .btn-toc{
  background:#f5ecd7;border:2px solid #d4a574;color:#a0522d;
  font-size:14px;padding:10px 20px;
}

/* ===== 结语页 ===== */
.end-page{
  width:100%;max-width:900px;min-height:100vh;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;text-align:center;
  background:linear-gradient(180deg,#f7e8d0,#fef9f0);
}
.end-page h2{font-size:36px;color:#8b4513;margin-bottom:16px;letter-spacing:4px}
.end-page p{font-size:18px;color:#5c40333;line-height:2}
.end-page .btn-restart{
  background:#8b4513;color:#fff;border:none;
  padding:12px 40px;font-size:18px;border-radius:40px;
  cursor:pointer;margin-top:30px;letter-spacing:2px;font-family:inherit;
  transition:.2s;
}
.end-page .btn-restart:hover{background:#a0522d}

/* ===== 响应式 ===== */
@media(max-width:600px){
  .cover h1{font-size:36px}
  .toc .toc-grid{grid-template-columns:1fr}
  .character-area{flex-direction:column;align-items:center}
  .character-img{width:140px}.character-img.dual{width:100px}
  .speech-bubble.left::before,.speech-bubble.left::after{display:none}
  .speech-bubble .text{font-size:18px}
  ruby{font-size:18px}rt{font-size:9px}
  .translation-area .tl-text{font-size:15px}
  .ch-toc .ch-toc-header .ch-name{font-size:28px}
  .comic-footer button{padding:8px 20px;font-size:14px}
}

/* ===== 人物关系图谱页 ===== */
*{box-sizing:border-box;margin:0;padding:0}

/* ===== 人物关系图谱页容器 ===== */
.relation-map-page{
  width:100%;background:#fdf6ec;color:#3b2f2f;
  min-height:100vh;overflow-x:hidden;
}
.relation-map-page .header{
  text-align:center;padding:30px 20px 10px;
  background:linear-gradient(180deg,#fef9f0,#f5ecd7);
}
.relation-map-page .header .series{font-size:14px;color:#b8860b;letter-spacing:4px}
.relation-map-page .header h1{font-size:36px;color:#8b4513;letter-spacing:6px;margin:6px 0}
.header .subtitle{font-size:16px;color:#a0522d;letter-spacing:2px}
.header .pinyin{font-size:14px;color:#b8860b;margin-top:4px;letter-spacing:1px}

.visitor-counter{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:12px;padding:8px 16px;
  background:rgba(139,69,19,0.08);border:1px solid rgba(212,165,116,0.3);
  border-radius:20px;
}
.visitor-counter .counter-icon{font-size:16px}
.visitor-counter .counter-label{font-size:13px;color:#a0522d;letter-spacing:1px}
.visitor-counter .counter-value{font-size:16px;font-weight:bold;color:#8b4513;letter-spacing:1px}

/* ===== 分类筛选 ===== */
.filter-bar{
  display:flex;justify-content:center;gap:8px;
  flex-wrap:wrap;padding:12px 20px;
  background:#f5ecd7;border-bottom:2px solid #e8d5b7;
  position:sticky;top:0;z-index:50;
}
.filter-btn{
  padding:6px 16px;border-radius:20px;cursor:pointer;
  font-size:13px;font-family:inherit;border:2px solid transparent;
  background:#fff;color:#8b4513;transition:.2s;letter-spacing:1px;
}
.filter-btn:hover{transform:translateY(-2px)}
.filter-btn.active{color:#fff;font-weight:bold}
.filter-btn[data-cat="all"]{background:#8b4513;color:#fff}
.filter-btn[data-cat="kongzi"]{background:#fff2cc;color:#806000;border-color:#fff2cc}
.filter-btn[data-cat="kongzi"].active{background:#daa520;color:#fff}
.filter-btn[data-cat="dizi"]{background:#d6e4f0;color:#1f4e79;border-color:#d6e4f0}
.filter-btn[data-cat="dizi"].active{background:#2f5496;color:#fff}
.filter-btn[data-cat="family"]{background:#e2efda;color:#375623;border-color:#e2efda}
.filter-btn[data-cat="family"].active{background:#538135;color:#fff}
.filter-btn[data-cat="junzi"]{background:#fce4d6;color:#843c0c;border-color:#fce4d6}
.filter-btn[data-cat="junzi"].active{background:#c55a11;color:#fff}
.filter-btn[data-cat="quanchen"]{background:#edeDED;color:#595959;border-color:#ededed}
.filter-btn[data-cat="quanchen"].active{background:#595959;color:#fff}
.filter-btn[data-cat="yinshi"]{background:#fff2e0;color:#8b5a00;border-color:#fff2e0}
.filter-btn[data-cat="yinshi"].active{background:#bf8f00;color:#fff}
.filter-btn[data-cat="leshi"]{background:#deeaf6;color:#1f3864;border-color:#deeaf6}
.filter-btn[data-cat="leshi"].active{background:#1f3864;color:#fff}
.filter-btn[data-cat="lishi"]{background:#e6e0ec;color:#4a2545;border-color:#e6e0ec}
.filter-btn[data-cat="lishi"].active{background:#7030a0;color:#fff}

/* ===== 图谱区域 ===== */
.map-container{
  position:relative;width:100%;max-width:1200px;
  margin:0 auto;padding:20px;overflow:visible;
}
.map-svg{
  width:100%;height:auto;display:block;
  background:radial-gradient(ellipse at center,#fef9f0 0%,#f5ecd7 100%);
  border-radius:20px;box-shadow:0 4px 20px rgba(139,69,19,0.08);
}

/* SVG 节点样式 */
.node{cursor:pointer}
.node-inner{transition:transform .3s ease}
.node-avatar{filter:drop-shadow(0 3px 8px rgba(139,69,19,0.2))}
.node-ring{fill:none;stroke-width:3;opacity:0.7;transition:.3s}
.node:hover .node-ring{opacity:1;stroke-width:4}
.node-label{
  font-size:13px;fill:#3b2f2f;font-family:"STKaiti","KaiTi","楷体",serif;
  text-anchor:middle;font-weight:bold;pointer-events:none;
}
.node-label.py{font-size:9px;fill:#a0522d;font-weight:normal}

/* 关系连线 */
.link{fill:none;opacity:0.3;transition:.3s}
.link:hover{opacity:0.8}
.link-teacher{stroke:#8b4513;stroke-width:2}
.link-family{stroke:#538135;stroke-width:2}
.link-brother{stroke:#538135;stroke-width:2;stroke-dasharray:6,3}
.link-friend{stroke:#daa520;stroke-width:1.5;stroke-dasharray:3,3}
.link-enemy{stroke:#c0392b;stroke-width:1.5;stroke-dasharray:2,4}
.link-spirit{stroke:#7030a0;stroke-width:1.5;stroke-dasharray:5,5}
.link-lord{stroke:#595959;stroke-width:1;stroke-dasharray:8,4}
.link-tongmen{stroke:#2f5496;stroke-width:1;stroke-dasharray:4,4}

/* ===== 详情弹窗 ===== */
.detail-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(59,47,47,0.5);z-index:100;
  align-items:center;justify-content:center;padding:20px;
}
.detail-overlay.show{display:flex}
.detail-card{
  background:#fef9f0;border-radius:20px;
  max-width:500px;width:100%;max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  border:4px solid #d4a574;
  animation:cardIn .3s ease;
}
@keyframes cardIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.detail-header{
  display:flex;align-items:center;gap:16px;
  padding:20px;background:linear-gradient(135deg,#fef9f0,#f5e6d0);
  border-radius:16px 16px 0 0;border-bottom:3px solid #d4a574;
}
.detail-avatar{
  width:80px;height:80px;border-radius:50%;
  border:4px solid #d4a574;object-fit:cover;flex-shrink:0;
  background:#f5ecd7;box-shadow:0 4px 12px rgba(139,69,19,0.15);
}
.detail-avatar.emoji{
  display:flex;align-items:center;justify-content:center;
  font-size:36px;background:#fff;
}
.detail-name{flex:1}
.detail-name .nm{font-size:24px;color:#8b4513;font-weight:bold;letter-spacing:2px}
.detail-name .py{font-size:13px;color:#a0522d;margin-top:2px}
.detail-name .zi{font-size:15px;color:#5c4033;margin-top:4px}
.detail-close{
  width:36px;height:36px;border-radius:50%;border:none;
  background:#f5ecd7;color:#8b4513;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.detail-close:hover{background:#8b4513;color:#fff}
.detail-body{padding:20px}
.detail-badge{
  display:inline-block;padding:3px 12px;border-radius:12px;
  font-size:12px;margin-bottom:12px;
}
.detail-section{margin-bottom:16px}
.detail-section .label{
  font-size:13px;color:#a0522d;font-weight:bold;
  letter-spacing:2px;margin-bottom:6px;
}
.detail-section .text{font-size:15px;line-height:1.8;color:#3b2f2f}
.detail-section .relations{font-size:14px;line-height:1.7;color:#5c4033}
.detail-section .relations .rel-item{
  display:inline-block;padding:2px 10px;margin:3px 4px 3px 0;
  background:#f5ecd7;border-radius:8px;font-size:13px;color:#5c4033;
  border-left:3px solid #d4a574;
}

/* ===== 图例 ===== */
.legend-bar{
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
  padding:12px 20px;background:#f5ecd7;border-top:2px solid #e8d5b7;
}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#5c4033}
.legend-line{width:24px;height:0;border-top-width:2px;border-top-style:solid}
.legend-dot{width:12px;height:12px;border-radius:50%}

/* ===== 底部 ===== */
.footer{
  text-align:center;padding:20px;color:#a09080;font-size:13px;
  background:#f5ecd7;border-top:2px solid #e8d5b7;
}
.footer a{color:#a0522d;text-decoration:none}

/* ===== 响应式 ===== */
@media(max-width:700px){
  .header h1{font-size:26px}
  .node-label{font-size:11px}
  .node-label.py{font-size:7px}
  .filter-btn{font-size:11px;padding:5px 12px}
  .detail-avatar{width:60px;height:60px}
  .detail-name .nm{font-size:20px}
}
</style>

<body>

<!-- ========== 人物关系图谱页 ========== -->
<div class="relation-map-page" id="relationMap" style="display:block">
<!-- 顶部标题 -->
<div class="header">
  <div class="series">— 论语漫画 · 人物篇 —</div>
  <h1>论语人物关系图谱</h1>
  <div class="pinyin">lùn yǔ rén wù guān xì tú pǔ</div>
  <div class="subtitle">✨ 点一点击头像，看看他们是谁 ✨</div>
  <div class="visitor-counter">
    <span class="counter-icon">👁️</span>
    <span class="counter-label">累计访问</span>
    <span class="counter-value" id="visitorCount">0</span>
  </div>
</div>

<!-- 分类筛选 -->
<div class="filter-bar" id="filterBar">
  <span class="filter-btn active" data-cat="all" onclick="filterCat('all')">全部</span>
  <span class="filter-btn" data-cat="kongzi" onclick="filterCat('kongzi')">孔子</span>
  <span class="filter-btn" data-cat="dizi" onclick="filterCat('dizi')">弟子</span>
  <span class="filter-btn" data-cat="family" onclick="filterCat('family')">家人</span>
  <span class="filter-btn" data-cat="junzi" onclick="filterCat('junzi')">君主</span>
  <span class="filter-btn" data-cat="quanchen" onclick="filterCat('quanchen')">权臣</span>
  <span class="filter-btn" data-cat="yinshi" onclick="filterCat('yinshi')">隐士</span>
  <span class="filter-btn" data-cat="leshi" onclick="filterCat('leshi')">乐师</span>
  <span class="filter-btn" data-cat="lishi" onclick="filterCat('lishi')">历史人物</span>
</div>

<!-- 图谱 -->
<div class="map-container">
  <svg class="map-svg" id="mapSvg" viewBox="0 0 1100 1200" preserveAspectRatio="xMidYMin meet">
    <!-- 关系连线 (JS 生成) -->
    <defs>
    <symbol id="avatar-1" viewBox="-40 -40 80 80">
    <circle cx="0" cy="0" r="39" fill="#f5e6d3" stroke="#8b4513" stroke-width="1.5"/>
    <ellipse cx="0" cy="-2" rx="22" ry="24" fill="#f5d0c5"/>
    <ellipse cx="0" cy="-26" rx="20" ry="16" fill="#f0f0f0"/>

  enemy:'#c0392b',
  spirit:'#7030a0',

var LINK_DASH = {
  teacher:'none',
  family:'none',
  brother:'6,3',
  friend:'3,3',
  enemy:'2,4',
  spirit:'5,5',
  lord:'8,4',

var peopleMap = {};
PEOPLE.forEach(function(p){ peopleMap[p.id] = p; });

function renderLinks(){
  var g = document.getElementById('links');
  var html = '';
  RELATIONS.forEach(function(r,i){
    var pa = peopleMap[r.a], pb = peopleMap[r.b];
    if(!pa || !pb) return;
    var color = LINK_COLORS[r.type] || '#999';
    var dash = LINK_DASH[r.type] || 'none';
    // 曲线连接
    var mx = (pa.x + pb.x) / 2;
    var my = (pa.y + pb.y) / 2;
    var dx = pb.x - pa.x;
    var dy = pb.y - pa.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var offset = Math.min(dist * 0.15, 30);
    var cx = mx - dy / dist * offset;
    var cy = my + dx / dist * offset;
    html += '<path class="link link-' + r.type + '" data-type="' + r.type + '" d="M' + pa.x + ',' + pa.y + ' Q' + cx + ',' + cy + ' ' + pb.x + ',' + pb.y + '" stroke="' + color + '" stroke-dasharray="' + dash + '">';
    html += '<title>' + pa.name + ' → ' + pb.name + '：' + r.label + '</title>';
    html += '</path>';
  });
  g.innerHTML = html;
}

function renderNodes(){
  var g = document.getElementById('nodes');
  var html = '';
  PEOPLE.forEach(function(p){
    var color = CAT_COLORS[p.cat] || '#999';
    var r = p.size / 2;
    html += '<g class="node" data-id="' + p.id + '" data-cat="' + p.cat + '" transform="translate(' + p.x + ',' + p.y + ')" onclick="showDetail(' + p.id + ')">';
    html += '<g class="node-inner">';
    // 外环
    html += '<circle class="node-ring" cx="0" cy="0" r="' + (r + 4) + '" stroke="' + color + '"/>';
    // 头像 - 有AI画像用图片，否则用SVG symbol
    if(p.img){
      html += '<clipPath id="clip-' + p.id + '"><circle cx="0" cy="0" r="' + r + '"/></clipPath>';
      html += '<image href="' + p.img + '" x="' + (-r) + '" y="' + (-r) + '" width="' + p.size + '" height="' + p.size + '" clip-path="url(#clip-' + p.id + ')" preserveAspectRatio="xMidYMid slice" onload="this.style.opacity=1" onerror="this.style.display=\x27none\x27;this.nextElementSibling.style.display=\x27inline\x27" style="opacity:0;transition:opacity .3s"/>';
      html += '<use href="#avatar-' + p.id + '" x="' + (-r) + '" y="' + (-r) + '" width="' + p.size + '" height="' + p.size + '" style="display:none"/>';
    } else {
      html += '<use href="#avatar-' + p.id + '" x="' + (-r) + '" y="' + (-r) + '" width="' + p.size + '" height="' + p.size + '"/>';
    }
    // 名字
    html += '<text class="node-label" x="0" y="' + (r + 16) + '">' + p.name + '</text>';
    html += '<text class="node-label py" x="0" y="' + (r + 28) + '">' + p.py + '</text>';
    html += '</g></g>';
  });
  g.innerHTML = html;
}

function filterCat(cat){
  document.querySelectorAll('.filter-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  document.querySelectorAll('.node').forEach(function(n){
    if(cat === 'all'){
      n.style.opacity = '1';
      n.style.pointerEvents = 'auto';
    } else {
      var match = n.dataset.cat === cat;
      n.style.opacity = match ? '1' : '0.15';
      n.style.pointerEvents = match ? 'auto' : 'none';
    }
  });
  document.querySelectorAll('.link').forEach(function(l){
    if(cat === 'all'){
      l.style.opacity = '';
    } else {
      l.style.opacity = '0.05';
    }
  });
}

// ============================================================

function hideAll(){
  document.getElementById('globalTOC').style.display='none';

}

// ============================================================
// 显示全局目录
// ============================================================
function goGlobalTOC(){
  curCh=-1;curSec=-1;
  hideAll();
  document.getElementById('globalTOC').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================
// 显示篇章目录
// ============================================================
function goChTOC(ci){
  curCh=ci;curSec=-1;
  hideAll();
  var el=document.getElementById('chTOC'+ci);
  if(el)el.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================
// 显示具体小节
// ============================================================
function goSection(ci,si){
  if(ci<0||ci>=BOOK.length)return;
  var ch=BOOK[ci];
  if(si<0||si>=ch.pages.length)return;
  addFinishCard();
  curCh=ci;curSec=si;
  hideAll();
  var pid='page_'+ci+'_'+si;
  var el=document.getElementById(pid);
  if(el)el.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================
// 从当前小节前后翻页
// ============================================================
function navSection(dir){
  if(curCh<0||curSec<0)return;
  var ch=BOOK[curCh];
  var ns=curSec+dir;
  if(ns>=0&&ns<ch.pages.length){goSection(curCh,ns);return;}
  // 跨篇章
  var nc=curCh+dir;
  if(nc<0){goGlobalTOC();return;}
  if(nc>=BOOK.length){showEnd();return;}
  goChTOC(nc);
}

// ============================================================
// 显示结语
// ============================================================
function showEnd(){
  curCh=-1;curSec=-1;
  hideAll();
  document.getElementById('end').style.display='flex';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================
// 构建全局目录
// ============================================================
function buildGlobalTOC(){
  var grid=document.getElementById('globalTOCGrid');
  var h='';
  for(var i=0;i<BOOK.length;i++){
    var ch=BOOK[i];
    h+='<div class="toc-card" onclick="goChTOC('+i+')">';
    h+='<span class="toc-num">'+(i+1)+'</span>';
    h+='<div class="toc-info"><div class="toc-title">'+esc(ch.title)+'</div>';
    h+='<div class="toc-sub">'+esc(ch.pinyin)+' · '+esc(ch.summary)+'</div>';
    h+='<div class="toc-count">共 '+ch.pages.length+' 节</div></div></div>';
  }
  h+='<!--阅读完毕卡片将在开始阅读后显示-->';
  grid.innerHTML=h;
}

// 读过内容后显示"阅读完毕"卡片
function addFinishCard(){
  if(hasRead)return;
  hasRead=true;
  var grid=document.getElementById('globalTOCGrid');
  var card=document.createElement('div');
  card.className='toc-card';
  card.setAttribute('style','border-left:4px solid #4caf50;background:#e8f5e9');
  card.onclick=showEnd;
  card.innerHTML='<span class="toc-num" style="background:#4caf50">🏁</span><div class="toc-info"><div class="toc-title">阅读完毕</div><div class="toc-sub">全部读完啦！</div></div>';
  grid.appendChild(card);
}

// ============================================================
// 构建所有页面
// ============================================================
function buildPages(){
  var container=document.getElementById('pageContainer');
  var html='';
  for(var ci=0;ci<BOOK.length;ci++){

    // 篇章目录
    html+='<div class="ch-toc" id="chTOC'+ci+'"><div class="ch-toc-header">';

    for(var si=0;si<ch.pages.length;si++){

    // 每个小节的漫画页
    for(var si=0;si<ch.pages.length;si++){
      var sec=ch.pages[si];
      var pid='page_'+ci+'_'+si;
      var total=ch.pages.length;
      html+='<div class="comic-page" id="'+pid+'">';
      html+='<div class="comic-header">';
      html+='<span class="chap-num">'+esc(ch.title)+'</span>';
      html+='<span class="chap-title">'+esc(sec.title)+'</span>';
      html+='<span class="page-indicator">'+(si+1)+' / '+total+'</span></div>';
      html+='<div class="comic-body">';

      // 图片+气泡
      var imgCls=sec.imgDual?'character-img dual':'character-img';

      html+='<div class="speech-area"><div class="speech-bubble left">';

      if(sec.yw){

        html+='<div class="yw-text">'+sec.yw+'</div></div>';
      }
      // 白话故事
      if(sec.story){
        html+='<div class="translation-area">';
        html+='<div class="tl-label">💬 白话小故事</div>';
        html+='<div class="tl-text">'+esc(sec.story)+'</div></div>';
      }
      html+='</div>';
      // 底部导航
      html+='<div class="comic-footer">';
      html+='<button'+(si===0?' disabled':'')+' onclick="navSection(-1)">◀ 上一节</button>';
      html+='<button class="btn-toc" onclick="goChTOC('+ci+')">📋 本篇目录</button>';
      html+='<button'+(si>=total-1?' disabled':'')+' onclick="navSection(1)">下一节 ▶</button>';
      html+='</div><div class="comic-footer" style="border-top:none;padding-top:4px">';
      var hasPrev=ci>0,hasNext=ci<BOOK.length-1;
      html+='<button'+(hasPrev?'':' disabled')+' onclick="goSection('+(ci-1)+','+(BOOK[ci-1]?BOOK[ci-1].pages.length-1:0)+')" style="font-size:13px">« 上一篇</button>';
      html+='<button class="btn-toc" onclick="goGlobalTOC()" style="font-size:13px">📜 全部目录</button>';
      html+='<button'+(hasNext?'':' disabled')+' onclick="goChTOC('+(ci+1)+')" style="font-size:13px">下一篇 »</button>';
      html+='</div></div>';
    }
  }
  container.innerHTML=html;
}

function updateVisitorCount(){
  var el = document.getElementById('visitorCount');
  if(!el) return;
  el.textContent = '...';
  fetch('/api/counter')
    .then(function(r){return r.json();})
    .then(function(d){
      if(d && typeof d.value === 'number'){
        el.textContent = d.value.toLocaleString();
        localStorage.setItem('lunyu_visitor_count', d.value.toString());
      }else{
        fallbackCount();
      }
    })
    .catch(function(){
      fallbackCount();
    });
}

function fallbackCount(){
  var el = document.getElementById('visitorCount');
  if(!el) return;
  var count = parseInt(localStorage.getItem('lunyu_visitor_count') || '0');
  count++;
  localStorage.setItem('lunyu_visitor_count', count.toString());
  el.textContent = count.toLocaleString();
}

  buildPages();
  buildGlobalTOC();
  // 初始化人物关系图谱
  if(typeof renderLinks==="function")renderLinks();
  if(typeof renderNodes==="function")renderNodes();
  goRelationMap();
  updateVisitorCount();
}

P('小朋友应该怎么做','孔子',KZ,

P('君子要庄重','孔子',KZ,
